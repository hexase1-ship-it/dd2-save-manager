<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="token" content="__TOKEN__">
  <meta name="color-scheme" content="dark">
  <title>DD2 Save Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-archive" viewBox="0 0 24 24"><path d="M3.5 7.5h17v11a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-11ZM2.5 4h19v3.5h-19zM9.5 12h5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4.2L19.5 8.7a2 2 0 0 0 0-2.8l-1.4-1.4a2 2 0 0 0-2.8 0L4 15.8V20ZM13.5 6.5l4 4"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4.5v4.2h4.2M12 8v4.5l3 1.8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.9 12a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4l.9-12M10 11v5.5M14 11v5.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4.2l2 2.2H19a1.5 1.5 0 0 1 1.5 1.5v9.3a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-11.5Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4.5v4.2h-4.2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4L12 4ZM12 10v4.5M12 17.2v.1"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8.5 5 4 9.5 8.5 14M4 9.5h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h10.5M9 12h10.5M9 17.5h10.5M4.75 6.5h.01M4.75 12h.01M4.75 17.5h.01"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h10.5v10.5H9zM6 15H4.5V4.5H15V6"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><path d="M12 20.5a8.5 8.5 0 1 0 0-17 8.5 8.5 0 0 0 0 17ZM3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5S9.700 5.900 12 3.500Z"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><path d="M6 10.5h12a1.5 1.5 0 0 1 1.5 1.5v6.500A1.500 1.500 0 0 1 18 20H6a1.500 1.500 0 0 1-1.500-1.500V12A1.500 1.500 0 0 1 6 10.500ZM8 10.500V7.500a4 4 0 0 1 7.700-1.500"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><path d="M5.5 5.500h13v13h-13z"/></symbol>
    <symbol id="i-unmax" viewBox="0 0 24 24"><path d="M5 8.500h10.500V19H5zM8.500 8.500V5H19v10.500h-3.500"/></symbol>
  </svg>

  <div class="app">
    <div class="edge-top" id="edge-top" hidden></div>

    <aside class="sidebar">
      <div class="brand drag">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1 id="brand-name">DD2 Save Manager</h1>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <header class="titlebar drag">
      <div class="titlebar-fill"></div>
      <span class="chip" id="game-state" hidden></span>
      <label class="lang">
        <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
        <span class="visually-hidden" id="lang-label">Language</span>
        <select id="lang-select"></select>
      </label>
      <div class="winbtns" id="winbtns" hidden>
        <button class="winbtn" data-act="minimize"><svg class="icon" aria-hidden="true"><use href="#i-min"/></svg></button>
        <button class="winbtn" data-act="maximize"><svg class="icon" aria-hidden="true"><use href="#i-max"/></svg></button>
        <button class="winbtn" data-act="close"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
    </header>

    <main id="main" class="content" tabindex="-1">
      <div class="view">
        <div class="skeleton-page" aria-busy="true">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row"></div>
        </div>
      </div>
    </main>

    <div id="applybar" class="applybar" hidden></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
